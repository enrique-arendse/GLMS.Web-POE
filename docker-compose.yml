version: '3.8'

services:

  # =========================================
  # SQL SERVER DATABASE
  # =========================================

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "GLMSPass123!"
      MSSQL_PID: "Express"

    ports:
      - "1433:1433"

    volumes:
      - sql-data:/var/opt/mssql

    networks:
      - glms-network

    restart: unless-stopped

    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GLMSPass123!' -Q 'SELECT 1' -C -b"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =========================================
  # BACKEND WEB API
  # =========================================

  glms-backend-api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: glms-backend-api

    depends_on:
      sql-server-db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:7001"

      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMSDb;User Id=sa;Password=GLMSPass123!;TrustServerCertificate=true;Encrypt=false;"

      JwtSettings__SecretKey: "your-super-secret-key-change-in-production-at-least-32-characters"
      JwtSettings__Issuer: "GLMS"
      JwtSettings__Audience: "GLMSUsers"
      JwtSettings__ExpirationMinutes: "60"

    ports:
      - "7001:7001"

    networks:
      - glms-network

    restart: unless-stopped

    healthcheck:
      test: [
        "CMD",
        "curl",
        "-f",
        "http://localhost:7001/swagger/index.html"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  # =========================================
  # FRONTEND MVC WEB APP
  # =========================================

  glms-frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.web

    container_name: glms-frontend-web

    depends_on:
      glms-backend-api:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:80"

      ApiSettings__BaseUrl: "http://glms-backend-api:7001"

    ports:
      - "80:80"

    volumes:
      - uploads-data:/app/wwwroot/uploads 

    networks:
      - glms-network

    restart: unless-stopped

    healthcheck:
      test: [
        "CMD",
        "curl",
        "-f",
        "http://localhost/"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


# =========================================
# VOLUMES
# =========================================

volumes:
  sql-data:
  uploads-data:  


# =========================================
# NETWORKS
# =========================================

networks:
  glms-network:
    driver: bridge